[package]
name = "freenames-zone"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
whoiam-delegation = { path = "../delegation" }
freenet-stdlib = { version = "0.8", features = ["contract"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false }
